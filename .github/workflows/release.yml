name: release

# Vydání se spouští tagem, například `git tag v0.2.0 && git push origin v0.2.0`.
# Číslo z tagu se propíše do sestavení, takže se verze v aplikaci nemůže rozejít s vydáním.
# Tag, VersionPrefix v Directory.Build.props a sekce v CHANGELOG.md musí sedět, jinak
# se nic nevypublikuje — kontroluje to scripts/verify-version.ps1.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Zkontrolovat verzi a vytáhnout popis vydání
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          .\scripts\verify-version.ps1 -Tag $tag -NotesOut release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $version = $tag.Substring(1)
          # Kontrola už build metadata odmítla, takže pomlčka může znamenat jen předvydání.
          # Předvydání se na GitHubu označí, aby ho `releases/latest` nenabízel uživatelům.
          $prerelease = if ($version -match '-') { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          Write-Host "Vydání $version (předvydání: $prerelease)"

      - name: Sestavit a otestovat
        run: |
          dotnet build HearthstoneBattlegroundsTracker.sln -c Release -p:Version=${{ steps.version.outputs.version }}
          dotnet test HearthstoneBattlegroundsTracker.sln -c Release --no-build
          dotnet format HearthstoneBattlegroundsTracker.sln --verify-no-changes --no-restore

      - name: Publikovat overlay
        shell: pwsh
        run: |
          dotnet publish src\Tracker.Desktop\Tracker.Desktop.csproj `
            -c Release -r win-x64 --self-contained true -o publish `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none
          $exe = 'publish\BattlegroundsTracker.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BattlegroundsTracker.exe" | Out-File "$exe.sha256" -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"

      - name: Vytvořit vydání
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            publish/BattlegroundsTracker.exe
            publish/BattlegroundsTracker.exe.sha256
