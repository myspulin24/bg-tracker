name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # Verzování se hlídá i mimo vydání, aby se rozpor mezi Directory.Build.props
      # a changelogem našel při commitu, ne až po pushnutí tagu.
      - name: Zkontrolovat verzování a changelog
        shell: pwsh
        run: |
          .\scripts\verify-version.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Release build musí projít bez varování, protože Directory.Build.props
      # zapíná TreatWarningsAsErrors.
      - run: dotnet build HearthstoneBattlegroundsTracker.sln -c Release
      - run: dotnet test HearthstoneBattlegroundsTracker.sln -c Release --no-build
      - run: dotnet format HearthstoneBattlegroundsTracker.sln --verify-no-changes --no-restore
